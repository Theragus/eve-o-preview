name: Build

# Produces a ready-to-run EVE-O Preview build on every push to master, on pull requests,
# and on demand. The result is a workflow artifact (Actions tab -> run -> "EVE-O Preview").
# Pushing a tag such as v10.0.0.13 additionally attaches the zip to a GitHub Release.
#
# This mirrors the Cake "Build" task in build/Tasks/Build.cs: a single-file, framework-dependent
# win-x64 app plus the NativeAOT Robin DLL. It does not run the Cake pipeline itself, which
# deletes output directories and expects a code-signing certificate.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v10.0.0.13). Leave empty for an artifact only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish EVE-O Preview (single file, framework dependent)
        run: >
          dotnet publish src/Eve-O-Preview/Eve-O-Preview.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -o out

      # NativeAOT needs the MSVC toolchain; the windows-latest runner image ships Visual Studio with it.
      - name: Publish Robin (NativeAOT shared library)
        run: >
          dotnet publish src/Eve-O-Preview.Robin/Eve-O-Preview.Robin.csproj
          -c Release -r win-x64 -p:PublishAot=true
          -o out

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item 'out/EVE-O Preview.exe' package/
          Copy-Item out/Eve-O-Preview.Robin.dll package/
          Copy-Item out/LICENSE.txt package/
          Copy-Item 'out/Launch Eve-O Preview with Verbose Logging.cmd' package/
          Get-ChildItem package

      - uses: actions/upload-artifact@v4
        with:
          name: EVE-O Preview
          path: package/
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: Compress-Archive -Path package/* -DestinationPath 'EVE-O Preview.zip'

      # On a tag push the release is attached to that tag. A manual run with release_tag set
      # creates the tag on the built commit as well, so a release can be cut from the Actions tab.
      # Release notes come from CHANGELOG.md: the section whose heading matches the version being
      # released (tag without the leading "v"). A missing section fails the release on purpose.
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          $tag = '${{ inputs.release_tag || github.ref_name }}'
          $version = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($version))\]" })
          if ($start -lt 0) { Write-Error "CHANGELOG.md has no '## [$version]' section; add one before releasing."; exit 1 }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $body += $lines[$i]
          }
          ($body -join "`n").Trim() | Set-Content -NoNewline release-notes.md
          Get-Content release-notes.md

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: EVE-O Preview ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: EVE-O Preview.zip

  # The xUnit suite creates real WinForms windows on a private desktop. It has not been exercised
  # on a hosted runner before, so it is reported separately and does not block the build artifact.
  test:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test src/tests/Eve-O-Preview.Tests/Eve-O-Preview.Tests.csproj -c Debug
